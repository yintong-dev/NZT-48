# Build one .skill file per skill and attach them to a GitHub Release when a v* tag is pushed.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package skills
        run: |
          for s in nzt-limitless nzt-soldier; do
            mkdir -p "build/$s"
            cp -R "skills/$s/." "build/$s/"
            cp LICENSE "build/$s/"
            (cd build && zip -r "../$s.skill" "$s")
          done

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" nzt-limitless.skill nzt-soldier.skill --title "$GITHUB_REF_NAME" --generate-notes
